<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.4 system-ui, sans-serif; width: 420px; margin: 0; padding: 12px; color: #1e293b; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  input[type=number] { width: 70px; }
  button { padding: 5px 12px; font-weight: 600; cursor: pointer; }
  #bar { height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; margin: 6px 0; }
  #fill { height: 100%; width: 0; background: #16a34a; transition: width .3s; }
  pre { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; padding: 6px; max-height: 260px; overflow: auto; font-size: 11px; white-space: pre-wrap; margin: 0; }
  .muted { color: #64748b; font-size: 11px; }
</style>
</head>
<body>
<h1>Sydney dashboard - verify listing status</h1>
<div class="row">
  <label>Pages <input type="number" id="cap" value="60" min="1" max="500"></label>
  <label><input type="checkbox" id="all"> include every active listing</label>
  <button id="go">Verify</button>
</div>
<div id="bar"><div id="fill"></div></div>
<div id="status" class="muted">Reads the worklist from localhost:8777, opens each page in a background tab, and posts what the page says (sold / under offer / withdrawn / on market) back to the dashboard.</div>
<pre id="log"></pre>
<script src="popup.js"></script>
</body>
</html>
